name: Verify

# Adapted from the parallel migration's workflow, which ran a mirror-fidelity
# suite. This runs the checks that matter for the rebuild — above all
# check:urls, which asserts every URL that ranked on WordPress still resolves
# or redirects. A migration that loses those loses the rankings with them.
#
# Action pins are the ones that repo used and that its runs passed on.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # typecheck, lint, check:urls, then npm test — which
      # builds the site and runs tests/ against a real next start server. No
      # separate build step: the suite cannot run without one.
      - name: Verify
        run: npm run verify
